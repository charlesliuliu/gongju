      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="600" cy="100" r="50" fill="#fde68a" opacity="0.9"/>
  <!-- Modern buildings -->
  <rect x="100" y="200" width="40" height="200" fill="#1e293b" rx="2"/>
  <rect x="160" y="150" width="35" height="250" fill="#334155" rx="2"/>
  <rect x="210" y="180" width="45" height="220" fill="#1e293b" rx="2"/>
  <rect x="270" y="220" width="30" height="180" fill="#475569" rx="2"/>
  <rect x="320" y="160" width="50" height="240" fill="#1e293b" rx="2"/>
  <rect x="390" y="190" width="35" height="210" fill="#334155" rx="2"/>
  <rect x="440" y="140" width="55" height="260" fill="#1e293b" rx="2"/>
  <rect x="510" y="210" width="35" height="190" fill="#475569" rx="2"/>
  <rect x="560" y="170" width="40" height="230" fill="#1e293b" rx="2"/>
  <rect x="620" y="200" width="30" height="200" fill="#334155" rx="2"/>
  <rect x="670" y="160" width="45" height="240" fill="#1e293b" rx="2"/>
