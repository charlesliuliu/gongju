    <rect x="340" y="220" width="6" height="20" rx="1"/>
    <rect x="355" y="220" width="6" height="20" rx="1"/>
    <rect x="445" y="160" width="8" height="25" rx="1"/>
    <rect x="465" y="160" width="8" height="25" rx="1"/>
    <rect x="485" y="160" width="8" height="25" rx="1"/>
  </g>
  <!-- Traditional temple -->
  <path d="M50 250 L100 200 L150 250" fill="#dc2626"/>
  <rect x="80" y="250" width="40" height="50" fill="#b91c1c"/>
  <rect x="95" y="270" width="10" height="18" rx="1" fill="#fbbf24"/>
