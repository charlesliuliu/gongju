    <rect x="120" y="408" width="40" height="3" rx="1"/>
    <rect x="220" y="408" width="40" height="3" rx="1"/>
    <rect x="320" y="408" width="40" height="3" rx="1"/>
    <rect x="420" y="408" width="40" height="3" rx="1"/>
    <rect x="520" y="408" width="40" height="3" rx="1"/>
    <rect x="620" y="408" width="40" height="3" rx="1"/>
    <rect x="720" y="408" width="40" height="3" rx="1"/>
