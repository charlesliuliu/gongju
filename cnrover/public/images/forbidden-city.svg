<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#991b1b"/>
      <stop offset="60%" style="stop-color:#b91c1c"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="400" cy="180" r="150" fill="url(#sun-glow)" opacity="0.3"/>
  <defs>
    <radialGradient id="sun-glow">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Roof -->
  <path d="M200 200 L400 120 L600 200 L560 210 L400 150 L240 210 Z" fill="#fbbf24"/>
  <path d="M200 200 L200 230 L600 230 L600 200" fill="#dc2626"/>
  <rect x="200" y="230" width="400" height="200" fill="#b91c1c"/>
  <!-- Windows -->
  <rect x="250" y="260" width="30" height="40" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="320" y="260" width="30" height="40" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="450" y="260" width="30" height="40" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="520" y="260" width="30" height="40" rx="2" fill="#fbbf24" opacity="0.3"/>
  <!-- Door -->
  <rect x="375" y="310" width="50" height="80" rx="4" fill="#7f1d1d"/>
  <circle cx="415" cy="355" r="3" fill="#fbbf24"/>
  <!-- Pillars -->
  <rect x="210" y="230" width="8" height="200" fill="#991b1b"/>
  <rect x="582" y="230" width="8" height="200" fill="#991b1b"/>
  <!-- Roof decorations -->
  <path d="M300 170 L400 120 L500 170" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <!-- Ground -->
  <path d="M0 430 Q100 410 200 420 Q300 400 400 415 Q500 405 600 418 Q700 410 800 420 L800 500 L0 500Z" fill="#713f12"/>
</svg>
